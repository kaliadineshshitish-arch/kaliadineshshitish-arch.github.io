function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function msgFor(name){
  return "Namaste! Main Dinesh Kalia, Amritsar se web developer.\n\n" +
  "Maine dekha " + name + " ki apni website nahi hai (ya purani hai) — patients aapko online dhoondh nahi paate.\n\n" +
  "Main aapke liye yeh bana sakta hoon:\n" +
  "• Hospital/clinic ki website (mobile par badhiya)\n" +
  "• Google par aayegi\n" +
  "• Appointment / WhatsApp enquiry button\n" +
  "• Doctor profile + services page\n" +
  "• 3-4 din mein taiyaar\n\n" +
  "Rate: Rs 3,000 (fixed — koi chhupa kharcha nahi)\n\n" +
  "Mera kaam dekhein:\n" + PORT + "\n\n" +
  "Pasand aaye to reply kar dein 🙂" + "\n\n— Dinesh Kalia\nWeb & App Developer, Amritsar\n📞 7888607326 (WhatsApp)";
}

var saved = {};
try { saved = JSON.parse(localStorage.getItem('leadnums') || '{}'); } catch(e){}

function render(){
  var q = document.getElementById('q').value.toLowerCase().trim();
  var d = sel.value;
  var out = [], n = 0;
  for (var i=0;i<DATA.length;i++){
    var r = DATA[i];
    if (d && r.d !== d) continue;
    if (q && (r.n+' '+r.d+' '+r.a).toLowerCase().indexOf(q) < 0) continue;
    n++;
    if (out.length >= 60) continue;
    var key = r.n + '|' + r.d;
    var gm = "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(r.n + ' ' + r.d + ' Punjab');
    out.push('<div class="card"><span class="badge">'+esc(r.t)+'</span>'+
      '<h3>'+esc(r.n)+'</h3>'+
      '<p class="meta">📍 '+esc(r.d)+', Punjab</p>'+
      '<p class="addr">'+esc(r.a)+'</p>'+
      '<div class="row"><a class="btn g" target="_blank" rel="noopener" href="'+gm+'">🔍 Google Maps</a></div>'+
      '<input class="num" inputmode="numeric" placeholder="Hospital ka WhatsApp number (10 digit)" value="'+(saved[key]||'')+'" '+
        'oninput="saveNum(this,\''+key.replace(/'/g,"\\'")+'\')">'+
      '<div class="row"><a class="btn w" id="wa'+i+'" target="_blank" rel="noopener">🟢 WhatsApp bhejein</a></div>'+
      '</div>');
    // stash index for the button
    setTimeout(function(){},0);
  }
  document.getElementById('list').innerHTML = out.join('');
  document.getElementById('cnt').textContent = n + ' hospitals' + (n>60 ? ' (pehle 60 dikh rahe hain — search karein)' : '');
  // wire whatsapp buttons
  var cards = document.querySelectorAll('#list .card');
  var idx = 0;
  for (var i=0;i<DATA.length;i++){
    var r=DATA[i];
    if (d && r.d !== d) continue;
    if (q && (r.n+' '+r.d+' '+r.a).toLowerCase().indexOf(q) < 0) continue;
    if (idx >= 60) break;
    (function(r, idx){
      var card = cards[idx];
      if (!card) return;
      var inp = card.querySelector('input.num');
      var btn = card.querySelector('.btn.w');
      function upd(){
        var p = (inp.value||'').replace(/\D/g,'');
        btn.href = p.length===10 ? ("https://wa.me/91"+p+"?text="+encodeURIComponent(msgFor(r.n)))
                                 : ("https://wa.me/?text="+encodeURIComponent(msgFor(r.n)));
      }
      inp.addEventListener('input', upd); upd();
    })(r, idx);
    idx++;
  }
}

function saveNum(el, key){
  var p = (el.value||'').replace(/\D/g,'');
  if (p.length===10){ saved[key]=p; try{ localStorage.setItem('leadnums', JSON.stringify(saved)); }catch(e){} }
}
