    if(q && (r.n+' '+r.d+' '+r.a).toLowerCase().indexOf(q)<0) continue;
    n++;
    if(out.length>=60) continue;
    var key=r.n+'|'+r.d;
    var gm="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.n+' '+r.d+' Punjab');
    out.push('<div class="card"><span class="badge">'+esc(r.t)+'</span><h3>'+esc(r.n)+'</h3>'+
      '<p class="meta">📍 '+esc(r.d)+', Punjab</p><p class="addr">'+esc(r.a)+'</p>'+
      '<div class="row"><a class="btn g" target="_blank" rel="noopener" href="'+gm+'">🔍 Google Maps</a></div>'+
      '<input class="num" inputmode="numeric" placeholder="Hospital ka WhatsApp number (10 digit)" value="'+(saved[key]||'')+'">'+
      '<div class="row"><a class="btn w" target="_blank" rel="noopener">🟢 WhatsApp bhejein</a></div></div>');
  }
  document.getElementById('list').innerHTML=out.join('');
  document.getElementById('cnt').textContent=n+' hospitals'+(n>60?' (pehle 60 — search karein)':'');
  var cards=document.querySelectorAll('#list .card'), idx=0;
  for(i=0;i<DATA.length;i++){
    r=DATA[i];
    if(d && r.d!==d) continue;
    if(q && (r.n+' '+r.d+' '+r.a).toLowerCase().indexOf(q)<0) continue;
    if(idx>=60) break;
    (function(r,card,key){
      if(!card) return;
      var inp=card.querySelector('input.num'), btn=card.querySelector('.btn.w');
      function upd(){
        var p=(inp.value||'').replace(/\D/g,'');
        btn.href = p.length===10 ? ("https://wa.me/91"+p+"?text="+encodeURIComponent(msgFor(r.n)))
                                 : ("https://wa.me/?text="+encodeURIComponent(msgFor(r.n)));
        if(p.length===10){ saved[key]=p; try{localStorage.setItem('matnums',JSON.stringify(saved));}catch(e){} }
      }
      inp.addEventListener('input',upd); upd();
    })(r, cards[idx], r.n+'|'+r.d);
    idx++;
  }
}
document.getElementById('q').addEventListener('input',render);
sel.addEventListener('change',render);
render();
</script></body></html>
